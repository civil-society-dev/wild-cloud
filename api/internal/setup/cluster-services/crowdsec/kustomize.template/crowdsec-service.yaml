apiVersion: v1
kind: Service
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
  labels:
    app: crowdsec
    managedBy: kustomize
    partOf: wild-cloud
spec:
  type: ClusterIP
  selector:
    app: crowdsec
    managedBy: kustomize
    partOf: wild-cloud
  ports:
  - name: lapi
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: prometheus
    port: 6060
    targetPort: 6060
    protocol: TCP
